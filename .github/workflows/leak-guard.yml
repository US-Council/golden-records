name: leak-guard

# This workflow is the automated enforcement of the repo's core invariant:
# ZERO real organization-specific data. It runs two independent checks —
# a gitleaks pattern scan and a literal-string denylist scan — and fails
# the build on any hit. See CONTRIBUTING.md and SECURITY.md for context.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: leak-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  # gitleaks/gitleaks-action requires a paid GITLEAKS_LICENSE for any
  # organization-owned repo (org-vs-personal-account gate added by the
  # gitleaks maintainers in 2023). The underlying gitleaks CLI itself is
  # MIT-licensed and free with no such gate, so the "Run gitleaks" step
  # below installs and runs the CLI binary directly instead of the action
  # wrapper — same open-source scan engine, same .gitleaks.toml config,
  # no license requirement.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL -o "$asset" "${base}/${asset}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify against the upstream checksum before extracting/running
          # anything, so a compromised release artifact can't slip in.
          grep " ${asset}\$" checksums.txt | sha256sum -c -

          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        shell: bash
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  denylist-scan:
    name: literal org-identifier denylist scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for denylisted literals
        shell: bash
        run: |
          set -euo pipefail

          denylist=".gitleaks-denylist.txt"
          if [ ! -f "$denylist" ]; then
            echo "::error::${denylist} is missing — leak-guard cannot run without it."
            exit 1
          fi

          hits=0
          while IFS= read -r line; do
            # Skip blank lines and comments.
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac

            # Search all tracked files (excluding this repo's own leak-guard
            # machinery, which necessarily documents the forbidden strings).
            matches=$(git grep -I -l -i -F -- "$line" -- \
              ':!.gitleaks-denylist.txt' \
              ':!.gitleaks.toml' \
              ':!CONTRIBUTING.md' \
              ':!.github/workflows/leak-guard.yml' \
              || true)

            if [ -n "$matches" ]; then
              echo "::error::Denylisted string '${line}' found in:"
              echo "$matches" | while IFS= read -r f; do
                echo "::error file=${f}::forbidden literal '${line}' found in ${f}"
              done
              hits=$((hits + 1))
            fi
          done < "$denylist"

          if [ "$hits" -gt 0 ]; then
            echo "leak-guard: ${hits} denylisted string(s) found. See errors above."
            echo "This repo must contain ZERO real organization-specific data."
            echo "See CONTRIBUTING.md for what to do next."
            exit 1
          fi

          echo "leak-guard: denylist scan passed, no forbidden literals found."
